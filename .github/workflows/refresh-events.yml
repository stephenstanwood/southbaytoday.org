name: Refresh Events

on:
  schedule:
    # Daily at 10:17 PM PDT / 9:17 PM PST, ahead of the 3:20 AM Mini plan refresh.
    # GitHub can start this hours late; the Mini watchdog keeps inputs fresh.
    - cron: "17 5 * * *"
  workflow_dispatch: # allow manual trigger

concurrency:
  group: refresh-events-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # The publication preflight must be able to merge competing writers.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: "npm"

      - name: Install dependencies
        run: npm ci --engine-strict

      - name: Check event runtime and publication safeguards
        run: npm run test:event-refresh

      - name: Generate events
        env:
          SBT_STRICT_EVENT_REFRESH: "1"
          # Mini checks inputs hourly and refreshes them after four hours.
          # Keep rejecting stale inputs when the producer or publication fails.
          SBT_EVENT_SNAPSHOT_MAX_AGE_HOURS: "8"
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: node scripts/generate-events.mjs

      - name: Verify generated health contract
        run: node scripts/events/verify-refresh-output.mjs --max-age-hours 1 --snapshot-max-age-hours 8

      - name: Commit updated events
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/south-bay
          git diff --staged --quiet || git commit -m "chore: refresh upcoming events"
          node scripts/events/publish-refresh.mjs

      - name: Alert on refresh failure
        if: ${{ failure() }}
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: node scripts/events/notify-workflow-failure.mjs
