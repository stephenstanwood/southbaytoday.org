name: Refresh Events
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Capture public source contracts
        run: |
          mkdir -p source-evidence
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const urls=[['museum-robots','https://www.losaltoshistory.org/robots.txt'],['jazz-robots','https://summerfest.sanjosejazz.org/robots.txt'],['museum-ical','https://www.losaltoshistory.org/events/?ical=1'],['museum-events','https://www.losaltoshistory.org/events/'],['jazz-lineup','https://summerfest.sanjosejazz.org/lineup'],['jazz-chronological','https://summerfest.sanjosejazz.org/chronological']];
          for(const [name,url] of urls){const res=await fetch(url,{headers:{'User-Agent':'SouthBaySignal/1.0 (stanwood.dev; public event aggregator)'},signal:AbortSignal.timeout(25000)});const body=await res.text();fs.writeFileSync(`source-evidence/${name}.txt`,body);const meta={url:res.url,status:res.status,headers:Object.fromEntries(res.headers),observedAt:new Date().toISOString(),bytes:body.length,sha256:crypto.createHash('sha256').update(body).digest('hex')};fs.writeFileSync(`source-evidence/${name}.json`,JSON.stringify(meta,null,2));console.log(name,JSON.stringify(meta),body.slice(0,700));}
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: public-source-contracts
          path: source-evidence/
          retention-days: 3
