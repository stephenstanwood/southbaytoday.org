name: Event Refresh Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: "npm"

      - name: Install dependencies
        run: npm ci --engine-strict

      # Executes the real generator in offline fixtures, including native .ts
      # imports and the guards that must preserve published files on failure.
      - name: Check event runtime and publication safeguards
        run: npm run test:event-refresh

      - name: Check APOD source integrity and failure preservation
        run: node --test scripts/generate-apod.test.mjs

      - name: Check council sources and digest recovery (offline)
        run: node --test scripts/lib/civic-meetings.test.mjs scripts/lib/primegov-digest.test.mjs scripts/lib/digest-staleness.test.mjs scripts/generate-digests.test.mjs

      - name: Check food permit source health and bounded blurbs
        run: node --test scripts/lib/scc-food-generation.test.mjs scripts/lib/scc-food-openings.test.mjs

      # Mini LaunchAgents must run node as a child of /bin/zsh (a direct
      # Homebrew node launch is SIGKILLed after every node upgrade), and the
      # scheduled plan/newsletter wrappers may only push verified data commits.
      - name: Check Mini launch agents and scheduled checkout guards
        run: node --test scripts/lib/launchd-plists.test.mjs scripts/newsletter/scheduled-preflight.test.mjs scripts/social/lib/published-default-plans.test.mjs

      - name: Check Recraft imports and quiet outage notifications (offline)
        run: node --test scripts/social/lib/recraft.test.mjs

      - name: Check newsletter signup and confirmation tracking
        run: npm run test:newsletter-signup

      - name: Check subscription defaults, visitor routing and duplicate generation (offline)
        run: npm run test:ai-routing
